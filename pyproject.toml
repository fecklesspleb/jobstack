[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobstack"
version = "0.1.0"
description = "Tag job-post text with the tools it names (Okta, Intune, Jamf, CrowdStrike...) using an open dictionary."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
jobstack = "jobstack.cli:main"

[tool.setuptools]
packages = ["jobstack"]

[tool.setuptools.package-data]
jobstack = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
